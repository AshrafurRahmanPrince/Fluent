name: fluento
description: A beginner-friendly language learning application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # cupertino_icons provides iOS-style icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Declare your image assets here so Flutter can bundle them in the app
  assets:
    - assets/images/logo.png
    - assets/images/reading.jpg
    - assets/images/writing.jpg
    - assets/images/speaking.jpg
    - assets/images/listening.jpg
